[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-data-tools"
version = "0.1.0"
description = "A governed Model Context Protocol (MCP) server exposing safe, audited tools for BigQuery, GCS, Airflow, and data-quality operations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umamahesh Ade" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "data-engineering",
    "bigquery",
    "airflow",
    "data-quality",
    "llm-agents",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Database",
    "Typing :: Typed",
]

dependencies = [
    "mcp>=1.6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "anyio>=4.4",
]

[project.optional-dependencies]
gcp = ["google-cloud-bigquery>=3.25", "google-cloud-storage>=2.17", "google-cloud-secret-manager>=2.20"]
azure = ["azure-identity>=1.17", "azure-keyvault-secrets>=4.8"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "types-PyYAML",
]
all = ["mcp-data-tools[gcp,azure,dev]"]

[project.urls]
Homepage = "https://github.com/umamahesh-ade/mcp-data-tools"
Documentation = "https://github.com/umamahesh-ade/mcp-data-tools/tree/main/docs"
Issues = "https://github.com/umamahesh-ade/mcp-data-tools/issues"
Changelog = "https://github.com/umamahesh-ade/mcp-data-tools/blob/main/CHANGELOG.md"

[project.scripts]
mcp-data-tools = "mcp_data_tools.server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_data_tools = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["anyio: mark a test as needing an anyio event loop (asyncio backend only, see conftest.py)"]

[tool.coverage.run]
source = ["src/mcp_data_tools"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_data_tools"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src/mcp_data_tools"]

[[tool.mypy.overrides]]
module = ["google.cloud.*", "azure.*"]
ignore_missing_imports = true

# PyYAML ships no inline types; types-PyYAML (declared in the `dev` extra)
# supplies stubs in a properly provisioned environment. This override is a
# defensive fallback for environments where that stub package isn't
# installed, so a missing dev-tooling package can't fail a strict build.
[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "examples"]
